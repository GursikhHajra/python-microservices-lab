services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-network

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/productdb
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  customer-service:
    build: ./customer-service
    container_name: customer-service
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/customerdb
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/orderdb
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
      customer-service:
        condition: service_started
    networks:
      - ecommerce-network

volumes:
  pgdata:

networks:
  ecommerce-network:
    driver: bridge
